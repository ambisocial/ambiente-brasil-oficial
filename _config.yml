# Configuração Jekyll - Tema Chirpy
remote_theme: cotes2020/jekyll-theme-chirpy

# Informações do site
title: Ambiente Brasil Oficial
description: >-
  Portal independente de notícias e análises sobre ambiente brasil oficial.
  Conteúdo editorial focado em sustentabilidade, economia circular e inovação ambiental.
url: "https://ambisocial.github.io"
baseurl: "/ambiente-brasil-oficial"

# Autor
author: Redação Ambiente Brasil Oficial
email: contato@ambiente-brasil-oficial.com

# Idioma e timezone
lang: pt-BR
timezone: America/Sao_Paulo

# Plugins (compatíveis com GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives

# Configurações de build
markdown: kramdown
highlighter: rouge
paginate: 10
paginate_path: "/page:num/"

# RSS Feed
feed:
  posts_limit: 20
  excerpt_only: false

# SEO
twitter:
  username: ambiente-brasil-oficial
  card: summary_large_image

# PWA
pwa:
  enabled: true
  sw_src: /sw.js

# Analytics (opcional - desativado por padrão)
google_analytics:
  id: # GA-XXXXXXX

# Comentários (desativado)
comments:
  active: # vazio = desativado

# Layout padrão
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      comments: false
